# Default values for Smokeping.
# Update these values according to your requirements.

smokeping:
  image:
    repository: sjultra/smokeping
    tag: ""                               # defaults to the chart's appVersion; set only to override
    pullPolicy: IfNotPresent
  service:
    nodePort: 30083                       # LAN access: http://<any-node-ip>:30083
  ingress:
    enabled: false                        # true = public at https://<host>; TLS is terminated by nginx on the proxy host
    host: ""                              # required when enabled
  metrics:                                # also push every measurement to Monitoring, with a Grafana dashboard
    enabled: true
    host: ingest.victoriametrics.svc      # Monitoring's ingest endpoint (InfluxDB line protocol)
    port: 8428
  persistence:                            # /data: the latency history (RRD files); survives pod restarts
    storageClass: ""                      # the cluster's default
    size: 1Gi

  # deployment target(s)
  nodeSelector: {}                        # the image is amd64 + arm64
  affinity: {}
  tolerations: []
