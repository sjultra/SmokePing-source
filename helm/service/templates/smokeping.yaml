apiVersion: apps/v1
kind: Deployment
metadata:
  name: smokeping
spec:
  replicas: 1
  strategy:
    type: Recreate          # one data directory on a single-node volume: never two pods at once
  selector:
    matchLabels:
      app: smokeping
  template:
    metadata:
      labels:
        app: smokeping
    spec:
      {{- with .Values.smokeping.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.smokeping.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.smokeping.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: smokeping
          image: "{{ .Values.smokeping.image.repository }}:{{ .Values.smokeping.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.smokeping.image.pullPolicy }}
          ports:
            - containerPort: 80
          {{- with .Values.smokeping.metrics }}
          {{- if .enabled }}
          env:                    # init.sh adds the *** InfluxDB *** section from these
            - name: INFLUXDB_HOST
              value: {{ .host | quote }}
            - name: INFLUXDB_PORT
              value: {{ .port | quote }}
          {{- end }}
          {{- end }}
          volumeMounts:
            - name: smokeping-data
              mountPath: /data            # the RRD files behind the graphs (`datadir` in config/config)
      volumes:
        - name: smokeping-data
          persistentVolumeClaim:
            claimName: smokeping-data

---
# deleted with the release: uninstalling deletes the latency history
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smokeping-data
  labels:
    app: smokeping
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.smokeping.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.smokeping.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: smokeping
spec:
  type: NodePort
  selector:
    app: smokeping
  ports:
    - name: http          # LAN access at http://<node-ip>:<nodePort>; public traffic goes nginx → Traefik → Ingress
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: {{ .Values.smokeping.service.nodePort }}
{{- if .Values.smokeping.ingress.enabled }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smokeping
  annotations:
    kubernetes.io/ingress.class: "traefik"  # TLS is terminated by nginx on the proxy host, which forwards to Traefik
spec:
  rules:
    - host: {{ required "smokeping.ingress.host is required when smokeping.ingress.enabled is true" .Values.smokeping.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smokeping
                port:
                  number: 80
{{- end }}
