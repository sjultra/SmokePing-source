# Lints the Helm chart and publishes it to GHCR.
# Runs on push to main or manual dispatch. The chart's image (appVersion) must
# be published first: run the image workflow, then re-run this.

name: "Publish Helm chart"

on:
  push:
    branches:
      - master
    paths:
      - "helm/service/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REGISTRY: oci://ghcr.io/sjultra/charts
      IMAGE: sjultra/smokeping
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Lint
        run: helm lint helm/service

      - name: Check version
        id: chart
        run: |
          NAME=$(yq '.name' helm/service/Chart.yaml)
          VERSION=$(yq '.version' helm/service/Chart.yaml)
          APP_VERSION=$(yq '.appVersion' helm/service/Chart.yaml)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if helm show chart "$REGISTRY/$NAME" --version "$VERSION" >/dev/null 2>&1; then
            echo "::notice::$NAME $VERSION is already published; bump version in helm/service/Chart.yaml to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif ! docker manifest inspect "$IMAGE:$APP_VERSION" >/dev/null 2>&1; then
            # a chart must never point at an image that doesn't exist
            echo "::error::$IMAGE:$APP_VERSION isn't published; run the image workflow, then re-run this"
            exit 1
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: steps.chart.outputs.published == 'false'
        run: helm package helm/service

      - name: Push
        if: steps.chart.outputs.published == 'false'
        run: helm push "${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz" "$REGISTRY"
