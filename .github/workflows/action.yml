# Builds sjultra/smokeping at the version in helm/service/Chart.yaml (appVersion).
# Manual only: bump appVersion (and the chart's version), commit, then run this.
# A version that's already published is never overwritten.

name: Build and push docker image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write       # GHCR push with GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: sjultra/smokeping
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/smokeping
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          VERSION=$(yq '.appVersion' helm/service/Chart.yaml)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::appVersion is missing from helm/service/Chart.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build: neither registry has it | copy: only Docker Hub does (a run that
      # failed pushing to GHCR) | done: both do
      - name: Check version
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          has() { docker manifest inspect "$1" >/dev/null 2>&1; }
          if has "$IMAGE:$VERSION" && has "$GHCR_IMAGE:$VERSION"; then
            echo "::notice::$VERSION is already published; bump appVersion in helm/service/Chart.yaml to publish"
            echo "action=done" >> "$GITHUB_OUTPUT"
          elif has "$IMAGE:$VERSION"; then
            echo "action=copy" >> "$GITHUB_OUTPUT"
          else
            echo "action=build" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.action != 'done'
        uses: docker/setup-buildx-action@v3

      # the same image, not a rebuild: both registries end up with one digest
      - name: Copy to GHCR
        if: steps.check.outputs.action == 'copy'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create -t "$GHCR_IMAGE:$VERSION" "$IMAGE:$VERSION"
          docker buildx imagetools create -t "$GHCR_IMAGE:latest" "$IMAGE:$VERSION"

      - name: Build and push
        if: steps.check.outputs.action == 'build'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.GHCR_IMAGE }}:latest
